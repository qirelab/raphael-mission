server {
    listen 80;
    server_name imraphael.com www.imraphael.com;

    root /var/www/raphael-mission/build;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    error_log /var/log/nginx/imraphael.error.log;
    access_log /var/log/nginx/imraphael.access.log;
}
