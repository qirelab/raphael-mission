server {
    listen 80;
    server_name raphael-mission.com www.raphael-mission.com;

    # API requests → Backend (localhost:6388)
    location /api {
        proxy_pass http://localhost:6388;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://localhost:6388;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Frontend static files
    location / {
        root /var/www/raphael-mission/build;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (images, fonts, CSS, JS)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/raphael-mission/build;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs
    error_log /var/log/nginx/raphael-mission.error.log;
    access_log /var/log/nginx/raphael-mission.access.log;
}
